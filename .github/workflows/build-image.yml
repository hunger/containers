name: Build container image

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 03:00 UTC = 04:00 Berlin (winter) / 05:00 Berlin (summer).
    - cron: "0 3 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: devbox-woodpecker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The devbox repo does not have a mise.toml yet; the placeholder in
      # devbox-woodpecker/mise.toml is used until it does. Once it exists,
      # this step overwrites the placeholder so the image pre-warms the real
      # tool list. On failure (file still missing) we keep the placeholder.
      - name: Fetch devbox mise.toml
        run: |
          set -euo pipefail
          url="https://codeberg.org/devbox-rs/devbox/raw/branch/main/mise.toml"
          if curl -fsSL "$url" -o /tmp/upstream-mise.toml; then
            cp /tmp/upstream-mise.toml devbox-woodpecker/mise.toml
            echo "Using upstream mise.toml"
          else
            echo "No upstream mise.toml, keeping placeholder"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # images: ghcr.io/${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./devbox-woodpecker
          file: devbox-woodpecker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
