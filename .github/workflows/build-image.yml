name: Build container image

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 03:00 UTC = 04:00 Berlin (winter) / 05:00 Berlin (summer).
    - cron: "0 3 * * *"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  fetch-devbox-mise-toml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The devbox repo does not have a mise.toml yet; the placeholder in
      # devbox-woodpecker/mise.toml is used until it does. Once it exists,
      # this step overwrites the placeholder so the image pre-warms the real
      # tool list. On failure (file still missing) we keep the placeholder.
      - name: Fetch upstream devbox mise.toml
        run: |
          set -euo pipefail
          url="https://codeberg.org/devbox-rs/devbox/raw/branch/main/mise.toml"
          if curl -fsSL "$url" -o /tmp/upstream-mise.toml; then
            cp /tmp/upstream-mise.toml devbox-woodpecker/mise.toml
            echo "Using upstream mise.toml"
          else
            echo "No upstream mise.toml, keeping placeholder"
          fi

  build-and-push-devbox-woodpecker:
    needs: fetch-devbox-mise-toml
    uses: ./.github/workflows/build-image-shared.yml
    with:
      image-name: devbox-woodpecker
      context: ./devbox-woodpecker
      file: devbox-woodpecker/Dockerfile

  build-and-push-dev-arch-toolbox:
    uses: ./.github/workflows/build-image-shared.yml
    with:
      image-name: dev-arch-toolbox
      context: ./dev-arch-toolbox
      file: dev-arch-toolbox/Dockerfile
